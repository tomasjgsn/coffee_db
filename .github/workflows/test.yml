name: Test

# The gates from docs/DESIGN_BRIEF.md Part III: typecheck, unit (including
# the golden migration parity test), and e2e against a disposable sandbox DB.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the app is developed on, so a red run is the
      # code, not a drifted toolchain.
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run check
      - run: npm test

      # Browser build matches the Playwright version locked in package-lock.json.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: app/test-results
          retention-days: 7
